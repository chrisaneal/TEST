<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Belle Meade - Shot List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a08;
    --card: #141412;
    --card-border: #1e1e1a;
    --card-elevated: #1a1a16;
    --gold: #CA8A04;
    --gold-soft: #d4a52a;
    --gold-dim: #6b5a1e;
    --gold-bg: rgba(202,138,4,0.08);
    --text: #e8e4dc;
    --text-secondary: #a8a295;
    --text-dim: #6b6560;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --green-border: rgba(34,197,94,0.25);
    --photo-bg: rgba(56,189,248,0.1);
    --photo-text: #38bdf8;
    --photo-border: rgba(56,189,248,0.2);
    --video-bg: rgba(251,146,60,0.1);
    --video-text: #fb923c;
    --video-border: rgba(251,146,60,0.2);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    position: fixed;
    top: 0;
    left: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(to bottom, var(--bg) 0%, var(--bg) 85%, transparent 100%);
    padding: calc(var(--safe-top) + 10px) 20px 14px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .header h1 {
    font-family: 'Cormorant', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .progress-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--card-border);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 1px;
    transition: width 0.3s ease;
  }

  .filter-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
    margin: 0 -20px;
    padding-left: 20px;
    padding-right: 20px;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 32px;
  }
  .filter-btn.active {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }

  /* ── Card container ── */
  .swipe-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding-top: calc(var(--safe-top) + 88px);
    overflow: hidden;
  }

  .cards-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    touch-action: pan-y;
  }

  .card {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 6px 12px calc(var(--safe-bottom) + 8px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
    will-change: transform, opacity;
  }

  .card.prev { transform: translateX(-100%); opacity: 0; }
  .card.active { transform: translateX(0); opacity: 1; }
  .card.next { transform: translateX(100%); opacity: 0; }
  .card.hidden { display: none; }

  .card-inner {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 108px);
    display: flex;
    flex-direction: column;
  }

  /* ── Card Hero ── */
  .card-hero {
    padding: 20px 20px 16px;
    background: linear-gradient(135deg, var(--card-elevated) 0%, var(--card) 100%);
    border-bottom: 1px solid var(--card-border);
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .card-number {
    font-family: 'Cormorant', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    margin-right: 4px;
    min-width: 28px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border: 1px solid transparent;
  }

  .badge-photo {
    background: var(--photo-bg);
    color: var(--photo-text);
    border-color: var(--photo-border);
  }
  .badge-video {
    background: var(--video-bg);
    color: var(--video-text);
    border-color: var(--video-border);
  }
  .badge-time {
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    border-color: var(--card-border);
  }
  .badge-location {
    background: var(--gold-bg);
    color: var(--gold-soft);
    border-color: rgba(202,138,4,0.2);
  }
  .badge-done {
    background: var(--green-bg);
    color: var(--green);
    border-color: var(--green-border);
  }

  .card-title {
    font-family: 'Cormorant', Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 4px;
    color: #fff;
  }

  .card-subtitle {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ── Card Sections ── */
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--card-border);
  }
  .card-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold-dim);
    margin-bottom: 6px;
  }

  .section-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    font-weight: 400;
  }

  /* ── Actors & Props row ── */
  .meta-row {
    display: flex;
    gap: 12px;
  }
  .meta-col {
    flex: 1;
    min-width: 0;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    padding: 4px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .tag-actor {
    border-color: rgba(202,138,4,0.15);
    color: var(--gold-soft);
    background: rgba(202,138,4,0.05);
  }

  /* ── Description highlight ── */
  .description-section {
    background: rgba(255,255,255,0.02);
  }
  .description-section .section-text {
    font-size: 16px;
    line-height: 1.65;
    color: #fff;
  }

  /* ── Dialogue ── */
  .dialogue-text {
    font-family: 'Cormorant', serif;
    font-size: 18px;
    font-style: italic;
    line-height: 1.5;
    color: var(--gold-soft);
  }

  /* ── Script link ── */
  .script-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--gold-bg);
    border: 1px solid rgba(202,138,4,0.15);
    border-radius: 12px;
    text-decoration: none;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
    transition: background 0.2s;
  }
  .script-link:active { background: rgba(202,138,4,0.15); }
  .script-link-arrow {
    font-size: 18px;
    opacity: 0.4;
  }

  /* ── Done Button ── */
  .done-section {
    margin-top: auto;
    padding: 16px 20px calc(var(--safe-bottom) + 8px);
  }

  .done-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 14px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    min-height: 56px;
  }

  .done-btn.undone {
    background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
    color: #fff;
    box-shadow: 0 4px 24px rgba(34,197,94,0.2);
  }
  .done-btn.undone:active {
    transform: scale(0.98);
    box-shadow: 0 2px 12px rgba(34,197,94,0.15);
  }

  .done-btn.is-done {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green-border);
    box-shadow: none;
  }

  /* ── Nav dots ── */
  .nav-hint {
    text-align: center;
    padding: 8px 0 4px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
  }

  /* ── Script modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    z-index: 200;
    justify-content: center;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    width: 100%;
    max-height: 80dvh;
    background: var(--card-elevated);
    border: 1px solid var(--card-border);
    border-radius: 20px 20px 0 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 20px calc(var(--safe-bottom) + 20px);
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--card-border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-close {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-close h3 {
    font-family: 'Cormorant', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
  }
  .modal-close button {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    min-height: 36px;
  }

  .modal-body {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
  }

  /* ── View Toggle (removed) ── */

  /* ── List View ── */
  .list-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding-top: calc(var(--safe-top) + 88px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
  }
  .list-container.visible { display: block; }

  .list-section-header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 10px 20px 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    font-family: 'Cormorant', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    cursor: pointer;
    transition: background 0.15s;
    min-height: 64px;
  }
  .list-item:active {
    background: rgba(255,255,255,0.03);
  }

  .list-item-time {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .list-item-type {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 6px;
    border-radius: 4px;
    min-width: 38px;
    text-align: center;
  }
  .list-item-type-photo {
    background: var(--photo-bg);
    color: var(--photo-text);
    border: 1px solid var(--photo-border);
  }
  .list-item-type-video {
    background: var(--video-bg);
    color: var(--video-text);
    border: 1px solid var(--video-border);
  }

  .list-item-content {
    flex: 1;
    min-width: 0;
  }

  .list-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-item-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-item-chevron {
    color: var(--text-dim);
    font-size: 16px;
    opacity: 0.3;
    flex-shrink: 0;
  }

  .list-item.is-done .list-item-title {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--card-border);
  }
  .list-item.is-done .list-item-meta {
    opacity: 0.5;
  }

  .list-done-header {
    padding: 16px 20px 8px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--green);
    border-top: 1px solid var(--card-border);
    margin-top: 8px;
  }

  .list-spacer {
    height: calc(var(--safe-bottom) + 20px);
  }

  /* ── Spreadsheet header button ── */
  .spreadsheet-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    cursor: pointer;
    min-height: 32px;
    min-width: 32px;
    justify-content: center;
    transition: background 0.2s;
    color: var(--text-secondary);
    text-decoration: none;
  }
  .spreadsheet-btn:active { background: rgba(255,255,255,0.08); }
  .spreadsheet-btn svg { flex-shrink: 0; }
  .spreadsheet-btn-text {
    display: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  @media (min-width: 769px) {
    .spreadsheet-btn {
      padding: 6px 12px;
    }
    .spreadsheet-btn-text { display: inline; }
  }

  /* ── Spreadsheet View ── */
  .spreadsheet-container {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 150;
    display: none;
    flex-direction: column;
  }
  .spreadsheet-container.visible { display: flex; }

  .spreadsheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--card-border);
    background: var(--card);
    flex-shrink: 0;
  }
  .spreadsheet-header h2 {
    font-family: 'Cormorant', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold);
  }
  .spreadsheet-close {
    padding: 8px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-height: 36px;
  }

  .spreadsheet-scroll {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  .spreadsheet-table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    font-size: 13px;
  }

  .spreadsheet-table thead {
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .spreadsheet-table th {
    background: var(--card-elevated);
    color: var(--gold-dim);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 12px;
    border: 1px solid var(--card-border);
    text-align: left;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }

  .spreadsheet-table td {
    padding: 6px 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    vertical-align: top;
    min-width: 80px;
    max-width: 300px;
  }

  .spreadsheet-table td[contenteditable] {
    cursor: text;
    outline: none;
  }
  .spreadsheet-table td[contenteditable]:focus {
    background: var(--card-elevated);
    box-shadow: inset 0 0 0 2px var(--gold-dim);
  }

  .spreadsheet-table td.col-id {
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    min-width: 60px;
    max-width: 60px;
  }
  .spreadsheet-table td.col-time { min-width: 70px; max-width: 80px; }
  .spreadsheet-table td.col-type { min-width: 60px; max-width: 70px; }
  .spreadsheet-table td.col-location { min-width: 100px; max-width: 150px; }
  .spreadsheet-table td.col-title { min-width: 180px; max-width: 250px; font-weight: 600; }
  .spreadsheet-table td.col-description { min-width: 250px; max-width: 400px; }
  .spreadsheet-table td.col-actors { min-width: 120px; max-width: 200px; }
  .spreadsheet-table td.col-props { min-width: 150px; max-width: 300px; }
  .spreadsheet-table td.col-emotion { min-width: 150px; max-width: 250px; }
  .spreadsheet-table td.col-blocking { min-width: 200px; max-width: 350px; }
  .spreadsheet-table td.col-dialogue { min-width: 150px; max-width: 300px; }

  .spreadsheet-table tr.section-row td {
    background: var(--gold-bg);
    color: var(--gold);
    font-family: 'Cormorant', serif;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 12px;
  }

  .spreadsheet-save-toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 20px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #fff;
    padding: 10px 24px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    z-index: 160;
    transition: transform 0.3s ease;
    pointer-events: none;
  }
  .spreadsheet-save-toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* ── Card view back button ── */
  .back-btn {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 6px 12px 6px 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    color: var(--gold);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 32px;
    transition: background 0.2s;
  }
  .back-btn:active { background: rgba(255,255,255,0.08); }
  .back-btn.visible { display: inline-flex; }
  .back-arrow { font-size: 16px; }

  /* ── Desktop ── */
  @media (min-width: 769px) {
    .card { padding: 6px calc((100vw - 420px) / 2) 8px; }
    .header { padding: 10px calc((100vw - 420px) / 2) 14px; }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .card, .progress-fill, .done-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="back-btn" id="backBtn" onclick="showListView()"><span class="back-arrow">&#8249;</span> List</button>
      <h1 id="headerTitle">Belle Meade</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="progress-text" id="progressText">1 / 80</span>
      <button class="spreadsheet-btn" id="spreadsheetBtn" onclick="openSpreadsheet()">

// Section labels for list view
const sectionLabels = {
  'farm-outdoor': 'Farm — Outdoor',
  'farm-indoor': 'Farm — Indoor',
  'farm-psb': 'Farm — Pour Some Bourbon',
  'bar-cocktails': 'Bar — Cocktail Recipes',
  'bar-carousels': 'Bar — Party Carousels',
  'bar-psb': 'Bar — Pour Some Bourbon'
};

const sectionOrder = ['farm-outdoor','farm-indoor','farm-psb','bar-cocktails','bar-carousels','bar-psb'];

// State
let currentView = 'list'; // start on list
let currentFilter = 'all';
let filteredShots = [...shots];
let currentIndex = 0;
let doneShots = JSON.parse(localStorage.getItem('bellemeade-done') || '{}');
let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;
let openedFromList = false;

function saveDone() {
  localStorage.setItem('bellemeade-done', JSON.stringify(doneShots));
}

function applyFilter(filter) {
  currentFilter = filter;
  if (filter === 'all') {
    filteredShots = [...shots];
  } else if (filter === 'done') {
    filteredShots = shots.filter(s => doneShots[s.id]);
  } else if (filter === 'remaining') {
    filteredShots = shots.filter(s => !doneShots[s.id]);
  } else {
    filteredShots = shots.filter(s => s.section === filter);
  }
  currentIndex = 0;
  if (currentView === 'card') renderCard();
  if (currentView === 'list') renderList();
  updateProgress();

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
}

function renderCard() {
  const wrapper = document.getElementById('cardsWrapper');
  if (filteredShots.length === 0) {
    wrapper.innerHTML = '<div class="card active" style="display:flex;align-items:center;justify-content:center;"><div style="text-align:center;color:var(--text-dim);"><p style="font-family:Cormorant,serif;font-size:24px;margin-bottom:8px;color:var(--text-secondary);">No shots</p><p style="font-size:13px;">Try a different filter</p></div></div>';
    return;
  }
  const baseShot = filteredShots[currentIndex];
  const shot = getShot(baseShot.id);
  const isDone = doneShots[shot.id];
  const shotNum = String(currentIndex + 1).padStart(2, '0');

  wrapper.innerHTML = `
    <div class="card active" id="activeCard">
      <div class="card-inner">
        <div class="card-hero">
          <div class="card-meta">
            <span class="card-number">${shotNum}</span>
            <span class="badge badge-time">${shot.time}</span>
            <span class="badge badge-${shot.type}">${shot.type.toUpperCase()}</span>
            <span class="badge badge-location">${shot.location}</span>
            ${isDone ? '<span class="badge badge-done">DONE</span>' : ''}
          </div>
          <div class="card-title">${shot.title}</div>
          <div class="card-subtitle">${shot.series}</div>
        </div>

        <div class="card-body">
          <div class="card-section">
            <div class="meta-row">
              <div class="meta-col">
                <div class="section-label">Actors</div>
                <div class="tag-list">
                  ${shot.actors.length ? shot.actors.map(a => `<span class="tag tag-actor">${a}</span>`).join('') : '<span class="tag" style="opacity:0.3;">None</span>'}
                </div>
              </div>
              <div class="meta-col">
                <div class="section-label">Props</div>
                <div class="tag-list">
                  ${shot.props.length ? shot.props.map(p => `<span class="tag">${p}</span>`).join('') : '<span class="tag" style="opacity:0.3;">None</span>'}
                </div>
              </div>
            </div>
          </div>

          <div class="card-section description-section">
            <div class="section-label">Shot Description</div>
            <div class="section-text">${shot.description}</div>
          </div>

          ${shot.emotion ? `<div class="card-section">
            <div class="section-label">Emotion / Tone</div>
            <div class="section-text">${shot.emotion}</div>
          </div>` : ''}

          ${shot.blocking ? `<div class="card-section">
            <div class="section-label">Blocking</div>
            <div class="section-text">${shot.blocking}</div>
          </div>` : ''}

          ${shot.dialogue ? `<div class="card-section">
            <div class="section-label">Dialogue</div>
            <div class="dialogue-text">${shot.dialogue}</div>
          </div>` : ''}

          ${shot.script ? `<div class="card-section">
            <a class="script-link" onclick="openModal('${shot.script}', '${shot.episode.replace(/'/g, "\\'")}')">
              View Full Script <span class="script-link-arrow">&#8250;</span>
            </a>
          </div>` : ''}

          <div class="done-section">
            <button class="done-btn ${isDone ? 'is-done' : 'undone'}" onclick="toggleDone('${shot.id}')">
              ${isDone ? 'COMPLETED' : 'MARK AS DONE'}
            </button>
            <div class="nav-hint">${currentIndex + 1} of ${filteredShots.length}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateProgress() {
  const total = filteredShots.length;
  const done = filteredShots.filter(s => doneShots[s.id]).length;
  document.getElementById('progressText').textContent = total > 0
    ? `${currentIndex + 1} / ${total} · ${done} done`
    : '0 shots';
  document.getElementById('progressFill').style.width = total > 0
    ? `${(done / total) * 100}%`
    : '0%';
}

function toggleDone(id) {
  if (doneShots[id]) {
    delete doneShots[id];
  } else {
    doneShots[id] = true;
  }
  saveDone();
  if (currentView === 'card') renderCard();
  renderList();
  updateProgress();
}

function goNext() {
  if (currentIndex < filteredShots.length - 1) {
    currentIndex++;
    renderCard();
    updateProgress();
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard();
    updateProgress();
  }
}

function openModal(scriptKey, episode) {
  const content = scripts[scriptKey] || 'Script not found.';
  document.getElementById('modalTitle').textContent = episode || 'Full Script';
  document.getElementById('modalBody').textContent = content;
  document.getElementById('scriptModal').classList.add('open');
}

function closeModal() {
  document.getElementById('scriptModal').classList.remove('open');
}

// ── View Switching ──
function showListView() {
  currentView = 'list';
  openedFromList = false;
  document.getElementById('swipeContainer').style.display = 'none';
  document.getElementById('listContainer').classList.add('visible');
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('headerTitle').textContent = 'Belle Meade';
  renderList();
  updateProgress();
}

function showCardView(fromList) {
  currentView = 'card';
  if (fromList) openedFromList = true;
  document.getElementById('swipeContainer').style.display = '';
  document.getElementById('listContainer').classList.remove('visible');
  document.getElementById('backBtn').classList.toggle('visible', !!fromList);
  renderCard();
  updateProgress();
}

function openShotFromList(shotId) {
  const idx = filteredShots.findIndex(s => s.id === shotId);
  if (idx >= 0) {
    currentIndex = idx;
    showCardView(true);
  }
}

// ── List Rendering ──
function renderList() {
  const container = document.getElementById('listContainer');
  const active = filteredShots.filter(s => !doneShots[s.id]);
  const done = filteredShots.filter(s => doneShots[s.id]);

  let html = '';

  // Group active shots by section
  const grouped = {};
  active.forEach(s => {
    if (!grouped[s.section]) grouped[s.section] = [];
    grouped[s.section].push(s);
  });

  sectionOrder.forEach(section => {
    if (!grouped[section] || grouped[section].length === 0) return;
    html += `<div class="list-section-header">${sectionLabels[section] || section}</div>`;
    grouped[section].forEach(shot => {
      html += renderListItem(shot, false);
    });
  });

  // Done section
  if (done.length > 0) {
    html += `<div class="list-done-header">Completed — ${done.length} shot${done.length !== 1 ? 's' : ''}</div>`;
    done.forEach(shot => {
      html += renderListItem(shot, true);
    });
  }

  html += '<div class="list-spacer"></div>';
  container.innerHTML = html;
}

function renderListItem(shot, isDone) {
  const s = getShot(shot.id);
  const actorStr = s.actors.length ? s.actors.join(', ') : '';
  const meta = [s.location, actorStr].filter(Boolean).join(' · ');
  return `
    <div class="list-item ${isDone ? 'is-done' : ''}" onclick="openShotFromList('${s.id}')">
      <div class="list-item-time">${s.time.replace(' AM','a').replace(' PM','p')}</div>
      <div class="list-item-type list-item-type-${s.type}">${s.type === 'video' ? 'VID' : 'PH'}</div>
      <div class="list-item-content">
        <div class="list-item-title">${s.title}</div>
        <div class="list-item-meta">${meta}</div>
      </div>
      <div class="list-item-chevron">&#8250;</div>
    </div>
  `;
}

// ── Spreadsheet ──
function openSpreadsheet() {
  document.getElementById('spreadsheetContainer').classList.add('visible');
  renderSpreadsheet();
}

function closeSpreadsheet() {
  document.getElementById('spreadsheetContainer').classList.remove('visible');
  // Re-render list with any edits
  applyFilter(currentFilter);
}

function renderSpreadsheet() {
  const cols = [
    { key: 'id', label: '#', editable: false },
    { key: 'time', label: 'Time', editable: true },
    { key: 'type', label: 'Type', editable: true },
    { key: 'location', label: 'Location', editable: true },
    { key: 'title', label: 'Title', editable: true },
    { key: 'description', label: 'Description', editable: true },
    { key: 'actors', label: 'Actors', editable: true },
    { key: 'props', label: 'Props', editable: true },
    { key: 'emotion', label: 'Emotion', editable: true },
    { key: 'blocking', label: 'Blocking', editable: true },
    { key: 'dialogue', label: 'Dialogue', editable: true }
  ];

  let html = '<table class="spreadsheet-table"><thead><tr>';
  cols.forEach(c => { html += `<th>${c.label}</th>`; });
  html += '</tr></thead><tbody>';

  let lastSection = '';
  shots.forEach((baseShot, i) => {
    const s = getShot(baseShot.id);
    // Section row
    if (s.section !== lastSection) {
      lastSection = s.section;
      html += `<tr class="section-row"><td colspan="${cols.length}">${sectionLabels[s.section] || s.section}</td></tr>`;
    }
    html += '<tr>';
    cols.forEach(c => {
      const val = c.key === 'actors' ? (s.actors || []).join(', ')
               : c.key === 'props' ? (s.props || []).join(', ')
               : (s[c.key] || '');
      const cls = `col-${c.key}`;
      if (c.editable) {
        html += `<td class="${cls}" contenteditable="true" data-shot-id="${s.id}" data-field="${c.key}" onblur="handleCellEdit(this)">${escapeHtml(val)}</td>`;
      } else {
        html += `<td class="${cls}">${escapeHtml(val)}</td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('spreadsheetScroll').innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function handleCellEdit(td) {
  const shotId = td.dataset.shotId;
  const field = td.dataset.field;
  let value = td.textContent.trim();

  // Find the base shot
  const base = shots.find(s => s.id === shotId);
  if (!base) return;

  // Get or create overrides for this shot
  const overrides = JSON.parse(localStorage.getItem('bellemeade-overrides') || '{}');
  if (!overrides[shotId]) overrides[shotId] = {};

  // Convert arrays
  if (field === 'actors' || field === 'props') {
    const arr = value ? value.split(',').map(s => s.trim()).filter(Boolean) : [];
    const baseVal = (base[field] || []).join(', ');
    if (value === baseVal) {
      delete overrides[shotId][field];
    } else {
      overrides[shotId][field] = arr;
    }
  } else {
    if (value === (base[field] || '')) {
      delete overrides[shotId][field];
    } else {
      overrides[shotId][field] = value;
    }
  }

  // Clean up empty override objects
  if (Object.keys(overrides[shotId]).length === 0) {
    delete overrides[shotId];
  }

  localStorage.setItem('bellemeade-overrides', JSON.stringify(overrides));

  // Show save toast
  const toast = document.getElementById('saveToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
}

// Get shot with overrides applied
function getShot(shotId) {
  const base = shots.find(s => s.id === shotId);
  if (!base) return null;
  const overrides = JSON.parse(localStorage.getItem('bellemeade-overrides') || '{}');
  if (!overrides[shotId]) return base;
  return { ...base, ...overrides[shotId] };
}

// ── Touch handling ──
const wrapper = document.getElementById('cardsWrapper');

wrapper.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchMoved = false;
}, { passive: true });

wrapper.addEventListener('touchmove', (e) => {
  touchMoved = true;
}, { passive: true });

wrapper.addEventListener('touchend', (e) => {
  if (!touchMoved) return;
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const dx = touchEndX - touchStartX;
  const dy = touchEndY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) goNext();
    else goPrev();
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'Escape' && openedFromList) showListView();
});

// Filter bar
document.getElementById('filterBar').addEventListener('click', (e) => {
  if (e.target.classList.contains('filter-btn')) {
    applyFilter(e.target.dataset.filter);
  }
});

// Modal close on overlay click
document.getElementById('scriptModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('scriptModal')) closeModal();
});

// ── Init: start on list view ──
showListView();
</script>
</body>
</html>
