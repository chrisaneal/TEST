{id:"ch-28",time:"4:45 PM",type:"both",section:"day3-exterior-pm",day:"day3",location:"Exterior",title:"Student on Steps / Stoop",description:"Student sitting on the front steps, backlit by golden hour sun. Reviewing notes or just taking in the end of the day. Bounce fill keeps face visible.",talent:["1 Student"],props:["Notebook or phone","Backpack (beside them)"],emotion:"Contentment, reflection, quiet pride -- a moment to just be",blocking:"Student sits on steps, weight leaned back. Golden sun behind them. Bounce board throws fill onto face. They look at notes or look out at the street. Camera is medium, eye level from the base of the steps."},
{id:"ch-29",time:"5:00 PM",type:"video",section:"day3-exterior-pm",day:"day3",location:"Exterior / Sidewalk",title:"The Walk Home",description:"Student walking down the sidewalk away from campus, city stretching ahead, backlit. The 'heading into your future' shot. Wide, cinematic, long lens.",talent:["1 Student"],props:["Backpack","Jacket"],emotion:"Independence, future, forward motion -- the city ahead is as much their destination as the campus behind",blocking:"Student walks away from camera down the sidewalk. City stretches ahead. Golden light from behind. Camera locked on long lens. They walk steadily, not looking back. The city swallows them gently."},
{id:"ch-30",time:"5:15 PM",type:"photo",section:"day3-exterior-pm",day:"day3",location:"Exterior",title:"Portrait Series - Chicago",description:"Individual portraits of 3-4 students and 1-2 faculty. Urban backdrop, golden hour, city texture behind each subject.",talent:["3-4 Students","1-2 Faculty"],props:["Scrubs","Badges","Stethoscopes (natural)"],emotion:"Pride, individuality, city-grit -- these are Chicago's nursing students",blocking:"Same portrait approach: golden backlight, bounce fill, prompted genuine expression. But backgrounds are urban -- brick walls, city signage, skyline glimpse. Multiple crops per person."},
{id:"ch-31",time:"5:30 PM",type:"photo",section:"day3-exterior-pm",day:"day3",location:"Exterior",title:"Duo Portrait",description:"Two students together -- friends, study partners. A candid portrait that shows the bond. Natural posing, golden light.",talent:["2 Students"],props:["Scrubs"],emotion:"Bond, partnership, shared journey -- these two will remember each other forever",blocking:"Two students stand together in golden light. Posing directed but casual. They might stand shoulder to shoulder or one leans slightly into the other. Expressions genuine. Medium, catching both faces."},
{id:"ch-32",time:"5:40 PM",type:"photo",section:"day3-exterior-pm",day:"day3",location:"Exterior",title:"Faculty Portrait - Warmth",description:"A faculty member photographed with warmth and respect -- not clinical, not corporate. A person who chose to teach and is proud. Golden hour light, soft expression.",talent:["1 Faculty Member"],props:["Professional attire","Badge (optional)"],emotion:"Pride, wisdom, dedication -- the teacher whose influence extends beyond the classroom",blocking:"Faculty member stands in golden light, body angled slightly. Expression is warm, not forced. Chris directs: 'What's the best thing a student ever said to you?' When the memory hits their face, that's the frame."},
{id:"ch-33",time:"5:50 PM",type:"both",section:"day3-exterior-pm",day:"day3",location:"Exterior",title:"Final Shot - City + Campus at Dusk",description:"As the light fades, a wide shot of the campus with interior lights glowing warm through the windows. City beginning to twinkle. The closer for the entire three-day shoot.",talent:[],props:["Interior lights visible through windows","City lights beginning"],emotion:"Warmth, permanence, invitation -- this place is here for you, day after day, lit from within",blocking:"Camera on locked tripod. Sky transitioning from gold to dusk. Interior lights glow warm through windows. City lights start to appear. Hold the frame. Let the light change over a few minutes. The final image of the shoot."}
];

const sectionLabels = {
  'day1-exterior-am': 'Day 1: Tinley Park -- Morning Exteriors',
  'day1-lobby': 'Day 1: Tinley Park -- Front Desk + Lobby',
  'day1-classroom': 'Day 1: Tinley Park -- Classroom',
  'day1-simcare': 'Day 1: Tinley Park -- SimCare + Skills Lab',
  'day1-wetlab': 'Day 1: Tinley Park -- Wet Lab + CAS',
  'day1-nclex': 'Day 1: Tinley Park -- NCLEX Bell Wall + Study Room',
  'day1-hesi': 'Day 1: Tinley Park -- HESI Assessment',
  'day1-exterior-pm': 'Day 1: Tinley Park -- Golden Hour',
  'day2-exterior-am': 'Day 2: Addison -- Morning Exteriors',
  'day2-commons': 'Day 2: Addison -- Lobby + Commons',
  'day2-simcare': 'Day 2: Addison -- SimCare + Skills Lab',
  'day2-wetlab': 'Day 2: Addison -- Wet Lab + CAS',
  'day2-care': 'Day 2: Addison -- Care Closet',
  'day2-exterior-pm': 'Day 2: Addison -- Golden Hour',
  'day3-exterior-am': 'Day 3: Chicago -- Morning Exteriors',
  'day3-commons': 'Day 3: Chicago -- Lobby + Commons',
  'day3-simcare': 'Day 3: Chicago -- SimCare + Skills Lab',
  'day3-wetlab': 'Day 3: Chicago -- Wet Lab + CAS + Study Hall',
  'day3-hesi': 'Day 3: Chicago -- HESI Assessment',
  'day3-exterior-pm': 'Day 3: Chicago -- Golden Hour'
};

const sectionOrder = [
  'day1-exterior-am','day1-lobby','day1-classroom','day1-simcare','day1-wetlab','day1-nclex','day1-hesi','day1-exterior-pm',
  'day2-exterior-am','day2-commons','day2-simcare','day2-wetlab','day2-care','day2-exterior-pm',
  'day3-exterior-am','day3-commons','day3-simcare','day3-wetlab','day3-hesi','day3-exterior-pm'
];

let sortMode = 'time';
let currentView = 'list';
let currentFilter = 'all';
let filteredShots = [...shots];
let currentIndex = 0;
let doneShots = JSON.parse(localStorage.getItem('chamberlain-done') || '{}');
let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;
let openedFromList = false;

function saveDone() {
  localStorage.setItem('chamberlain-done', JSON.stringify(doneShots));
}

function getShot(shotId) {
  const base = shots.find(s => s.id === shotId);
  if (!base) return null;
  const overrides = JSON.parse(localStorage.getItem('chamberlain-overrides') || '{}');
  if (!overrides[shotId]) return base;
  return { ...base, ...overrides[shotId] };
}

function applyFilter(filter) {
  currentFilter = filter;
  if (filter === 'all') filteredShots = [...shots];
  else if (filter === 'done') filteredShots = shots.filter(s => doneShots[s.id]);
  else if (filter === 'remaining') filteredShots = shots.filter(s => !doneShots[s.id]);
  else filteredShots = shots.filter(s => s.day === filter);
  currentIndex = 0;
  if (currentView === 'card') renderCard();
  if (currentView === 'list') renderList();
  updateProgress();
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
}

function getTypeBadgeClass(type) {
  if (type === 'both') return 'badge-both';
  if (type === 'video') return 'badge-video';
  return 'badge-photo';
}
function getTypeLabel(type) {
  if (type === 'both') return 'PHOTO + VIDEO';
  if (type === 'video') return 'VIDEO';
  return 'PHOTO';
}
function getTypeShort(type) {
  if (type === 'both') return 'P+V';
  if (type === 'video') return 'VID';
  return 'PH';
}
function getListTypeClass(type) {
  if (type === 'both') return 'list-item-type-both';
  if (type === 'video') return 'list-item-type-video';
  return 'list-item-type-photo';
}
function getDayClass(day) {
  if (day === 'day1') return 'day-1';
  if (day === 'day2') return 'day-2';
  return 'day-3';
}
function getDayLabel(day) {
  if (day === 'day1') return 'DAY 1';
  if (day === 'day2') return 'DAY 2';
  return 'DAY 3';
}

function renderCard() {
  const wrapper = document.getElementById('cardsWrapper');
  if (filteredShots.length === 0) {
    wrapper.innerHTML = '<div class="card active" style="display:flex;align-items:center;justify-content:center;"><div style="text-align:center;color:var(--text-dim);"><p style="font-family:Cormorant,serif;font-size:24px;margin-bottom:8px;color:var(--text-secondary);">No shots</p><p style="font-size:13px;">Try a different filter</p></div></div>';
    return;
  }
  const baseShot = filteredShots[currentIndex];
  const shot = getShot(baseShot.id);
  const isDone = doneShots[shot.id];
  const shotNum = String(currentIndex + 1).padStart(2, '0');
  wrapper.innerHTML = `
    <div class="card active" id="activeCard">
      <div class="card-inner">
        <div class="card-hero">
          <div class="card-meta">
            <span class="card-number">${shotNum}</span>
            <span class="badge badge-time">${shot.time}</span>
            <span class="badge ${getTypeBadgeClass(shot.type)}">${getTypeLabel(shot.type)}</span>
            <span class="badge badge-location">${shot.location}</span>
            <span class="day-indicator ${getDayClass(shot.day)}">${getDayLabel(shot.day)}</span>
            ${isDone ? '<span class="badge badge-done">DONE</span>' : ''}
          </div>
          <div class="card-title">${shot.title}</div>
          <div class="card-subtitle">${sectionLabels[shot.section] || shot.section}</div>
        </div>
        <div class="card-body">
          <div class="card-section">
            <div class="meta-row">
              <div class="meta-col">
                <div class="section-label">Talent</div>
                <div class="tag-list">
                  ${shot.talent.length ? shot.talent.map(a => '<span class="tag tag-talent">'+a+'</span>').join('') : '<span class="tag" style="opacity:0.3;">None</span>'}
                </div>
              </div>
              <div class="meta-col">
                <div class="section-label">Props</div>
                <div class="tag-list">
                  ${shot.props.length ? shot.props.map(p => '<span class="tag">'+p+'</span>').join('') : '<span class="tag" style="opacity:0.3;">None</span>'}
                </div>
              </div>
            </div>
          </div>
          <div class="card-section description-section">
            <div class="section-label">Shot Description</div>
            <div class="section-text">${shot.description}</div>
          </div>
          ${shot.emotion ? '<div class="card-section"><div class="section-label">Emotion / Tone</div><div class="section-text">'+shot.emotion+'</div></div>' : ''}
          ${shot.blocking ? '<div class="card-section"><div class="section-label">Blocking</div><div class="section-text">'+shot.blocking+'</div></div>' : ''}
          <div class="done-section">
            <button class="done-btn ${isDone ? 'is-done' : 'undone'}" onclick="toggleDone('${shot.id}')">
              ${isDone ? 'COMPLETED' : 'MARK AS DONE'}
            </button>
            <div class="nav-hint">${currentIndex + 1} of ${filteredShots.length}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateProgress() {
  const total = filteredShots.length;
  const done = filteredShots.filter(s => doneShots[s.id]).length;
  document.getElementById('progressText').textContent = total > 0 ? `${currentIndex + 1} / ${total} \u00b7 ${done} done` : '0 shots';
  document.getElementById('progressFill').style.width = total > 0 ? `${(done / total) * 100}%` : '0%';
}

function toggleDone(id) {
  if (doneShots[id]) delete doneShots[id];
  else doneShots[id] = true;
  saveDone();
  if (currentView === 'card') renderCard();
  renderList();
  updateProgress();
}

function goNext() {
  if (currentIndex < filteredShots.length - 1) { currentIndex++; renderCard(); updateProgress(); }
}
function goPrev() {
  if (currentIndex > 0) { currentIndex--; renderCard(); updateProgress(); }
}

function showListView() {
  currentView = 'list'; openedFromList = false;
  document.getElementById('swipeContainer').style.display = 'none';
  document.getElementById('listContainer').classList.add('visible');
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('headerTitle').textContent = 'Chamberlain';
  renderList(); updateProgress();
}

function showCardView(fromList) {
  currentView = 'card';
  if (fromList) openedFromList = true;
  document.getElementById('swipeContainer').style.display = '';
  document.getElementById('listContainer').classList.remove('visible');
  document.getElementById('backBtn').classList.toggle('visible', !!fromList);
  renderCard(); updateProgress();
}

function openShotFromList(shotId) {
  const idx = filteredShots.findIndex(s => s.id === shotId);
  if (idx >= 0) { currentIndex = idx; showCardView(true); }
}

function toggleSort() {
  sortMode = sortMode === 'time' ? 'location' : 'time';
  document.getElementById('sortBtnText').textContent = sortMode === 'time' ? 'Sort: Time' : 'Sort: Location';
  renderList();
}

function renderList() {
  const container = document.getElementById('listContainer');
  const active = filteredShots.filter(s => !doneShots[s.id]);
  const done = filteredShots.filter(s => doneShots[s.id]);
  let html = '';
  if (sortMode === 'location') {
    const grouped = {};
    active.forEach(s => {
      const key = s.location;
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(s);
    });
    Object.keys(grouped).sort().forEach(key => {
      html += '<div class="list-section-header">' + key + '</div>';
      grouped[key].forEach(shot => { html += renderListItem(shot, false); });
    });
  } else {
    const grouped = {};
    active.forEach(s => {
      if (!grouped[s.section]) grouped[s.section] = [];
      grouped[s.section].push(s);
    });
    sectionOrder.forEach(section => {
      if (!grouped[section] || grouped[section].length === 0) return;
      html += '<div class="list-section-header">' + (sectionLabels[section] || section) + '</div>';
      grouped[section].forEach(shot => { html += renderListItem(shot, false); });
    });
  }
  if (done.length > 0) {
    html += '<div class="list-done-header">Completed \u2014 ' + done.length + ' shot' + (done.length !== 1 ? 's' : '') + '</div>';
    done.forEach(shot => { html += renderListItem(shot, true); });
  }
  html += '<div class="list-spacer"></div>';
  container.innerHTML = html;
}

function renderListItem(shot, isDone) {
  const s = getShot(shot.id);
  const talentStr = s.talent.length ? s.talent.join(', ') : '';
  const meta = [s.location, talentStr].filter(Boolean).join(' \u00b7 ');
  return `
    <div class="list-item ${isDone ? 'is-done' : ''}" onclick="openShotFromList('${s.id}')">
      <div class="list-item-time">${s.time.replace(' AM','a').replace(' PM','p')}</div>
      <div class="list-item-type ${getListTypeClass(s.type)}">${getTypeShort(s.type)}</div>
      <div class="list-item-content">
        <div class="list-item-title">${s.title}</div>
        <div class="list-item-meta">${meta}</div>
      </div>
      <div class="list-item-chevron">&#8250;</div>
    </div>
  `;
}

function openSpreadsheet() {
  document.getElementById('spreadsheetContainer').classList.add('visible');
  renderSpreadsheet();
}

function closeSpreadsheet() {
  document.getElementById('spreadsheetContainer').classList.remove('visible');
  applyFilter(currentFilter);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderSpreadsheet() {
  const cols = [
    { key: 'id', label: '#', editable: false },
    { key: 'time', label: 'Time', editable: true },
    { key: 'type', label: 'Type', editable: true },
    { key: 'location', label: 'Location', editable: true },
    { key: 'title', label: 'Title', editable: true },
    { key: 'description', label: 'Description', editable: true },
    { key: 'talent', label: 'Talent', editable: true },
    { key: 'props', label: 'Props', editable: true },
    { key: 'emotion', label: 'Emotion', editable: true },
    { key: 'blocking', label: 'Blocking', editable: true }
  ];
  let html = '<table class="spreadsheet-table"><thead><tr>';
  cols.forEach(c => { html += '<th>' + c.label + '</th>'; });
  html += '</tr></thead><tbody>';
  let lastSection = '';
  shots.forEach((baseShot, i) => {
    const s = getShot(baseShot.id);
    if (s.section !== lastSection) {
      lastSection = s.section;
      html += '<tr class="section-row"><td colspan="' + cols.length + '">' + (sectionLabels[s.section] || s.section) + '</td></tr>';
    }
    html += '<tr>';
    cols.forEach(c => {
      const val = c.key === 'talent' ? (s.talent || []).join(', ') : c.key === 'props' ? (s.props || []).join(', ') : (s[c.key] || '');
      const cls = 'col-' + c.key;
      if (c.editable) {
        html += '<td class="' + cls + '" contenteditable="true" data-shot-id="' + s.id + '" data-field="' + c.key + '" onblur="handleCellEdit(this)">' + escapeHtml(val) + '</td>';
      } else {
        html += '<td class="' + cls + '">' + escapeHtml(val) + '</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('spreadsheetScroll').innerHTML = html;
}

function handleCellEdit(td) {
  const shotId = td.dataset.shotId;
  const field = td.dataset.field;
  let value = td.textContent.trim();
  const base = shots.find(s => s.id === shotId);
  if (!base) return;
  const overrides = JSON.parse(localStorage.getItem('chamberlain-overrides') || '{}');
  if (!overrides[shotId]) overrides[shotId] = {};
  if (field === 'talent' || field === 'props') {
    const arr = value ? value.split(',').map(s => s.trim()).filter(Boolean) : [];
    const baseVal = (base[field] || []).join(', ');
    if (value === baseVal) delete overrides[shotId][field];
    else overrides[shotId][field] = arr;
  } else {
    if (value === (base[field] || '')) delete overrides[shotId][field];
    else overrides[shotId][field] = value;
  }
  if (Object.keys(overrides[shotId]).length === 0) delete overrides[shotId];
  localStorage.setItem('chamberlain-overrides', JSON.stringify(overrides));
  const toast = document.getElementById('saveToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
}

// Touch / swipe
const wrapper = document.getElementById('cardsWrapper');
wrapper.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchMoved = false;
}, { passive: true });
wrapper.addEventListener('touchmove', (e) => { touchMoved = true; }, { passive: true });
wrapper.addEventListener('touchend', (e) => {
  if (!touchMoved) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) goNext(); else goPrev();
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'Escape' && openedFromList) showListView();
});

// Filter clicks
document.getElementById('filterBar').addEventListener('click', (e) => {
  if (e.target.classList.contains('filter-btn')) applyFilter(e.target.dataset.filter);
});

// Init
applyFilter('day1');
showListView();
</script>
</body>
</html>
